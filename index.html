    if (await saveDay(el.dataset.day || dayKey(), {fondo:r2(n), opened:true, openedAt:Date.now(), openedBy:who, prevClose:(lastClose() || {counted:null}).counted})) { toast('Caja abierta con ' + money(n) + '.'); paint(); }
  },
  cashout(){ openCashout(); },
  cashin(){ openCashin(); },
  cigo(el){ saveCashin(el); },
  async delci(el){
    const id = el.dataset.id;
    if (S.delCo !== id) { S.delCo = id; paint(); setTimeout(() => { if (S.delCo === id) { S.delCo = null; render(); } }, 4000); return; }
    S.delCo = null;
    if (await write(() => S.db.doc('cashins/' + id).delete())) { toast('Movimiento quitado.'); paint(); }
  },
  cogo(el){ saveCashout(el); },
  async delco(el){
    const id = el.dataset.id;
    if (S.delCo !== id) { S.delCo = id; paint(); setTimeout(() => { if (S.delCo === id) { S.delCo = null; render(); } }, 4000); return; }
    S.delCo = null;
    if (await write(() => S.db.doc('cashouts/' + id).delete())) { toast('Retiro quitado.'); paint(); }
  },
  async pinsave(){
    const a = ($('#pin1') || {}).value || '', b = ($('#pin2') || {}).value || '';
    if (!/^\d{4,8}$/.test(a)) { toast('El código debe tener de 4 a 8 números.'); return; }
    if (a !== b) { toast('Los dos códigos no coinciden.'); return; }
    try { await S.db.rpc('set_admin_pin', {p_pin:a}); } catch { toast('No se pudo guardar el código.'); return; }
    await loadSecrets(); S.unlocked = true; toast('Código guardado.'); paint();
  },
  async pinenter(){
    if (S.lockUntil > Date.now()) { toast('Espera unos segundos antes de intentar otra vez.'); return; }
    const inp = $('#pin'), v = inp ? inp.value : '';
    if (!v) { toast('Escribe el código.'); return; }
    const ok = await checkAdminPin(v);
    if (ok === null) return;
    if (ok) { S.unlocked = true; paint(); return; }
    toast('Código incorrecto.'); inp.value = ''; inp.focus();
  },
  reopenask(){ S.reopenAsk = true; paint(); },
  reopencancel(){ S.reopenAsk = false; paint(); },
  /* Reabrir = nuevo turno: el cierre anterior se guarda en el historial y el total contado pasa a ser la nueva apertura. */
  async reopen(){
    if (S.day !== dayKey()) return;
    const dd = S.days[S.day] || {}, st = dayStats(S.day);
    const who = await askWho('rwho', 'reabre'); if (!who) return;
    const raw = $('#rfondo').value, n = parseFloat(raw);
    if (raw === '' || isNaN(n) || n < 0) { toast('Escribe el efectivo con el que se vuelve a abrir.'); return; }
    const summary = {openedAt:dd.openedAt || null, openedBy:dd.openedBy || '', closedAt:dd.closedAt, closedBy:dd.closedBy || '', fondo:st.fondo, counted:+dd.counted || 0, retiros:+dd.retiros || 0, ingresos:+dd.ingresos || 0,
      cashSales:+dd.cashSales || 0, ventasContadas:+dd.ventasContadas || 0, diff:+dd.diff || 0, totals:dd.totals || null, note:dd.note || '',
      cardSystem:dd.cardSystem ?? null, cardCounted:dd.cardCounted ?? null, cardDiff:dd.cardDiff ?? null, transSystem:dd.transSystem ?? null, transCounted:dd.transCounted ?? null, transDiff:dd.transDiff ?? null};
    const doc = {day:S.day, sessions:[...(dd.sessions || []), summary], fondo:r2(n), opened:true, openedAt:Date.now(), openedBy:who, prevClose:+dd.counted || 0, closed:false};
    S.reopenAsk = false;
    if (await write(() => S.db.doc('days/' + S.day).set(doc))) { toast('Caja reabierta con ' + money(n) + '.'); paint(); }
  },
  addp(){ addProduct(); },
  async addc(){
    const n = ($('#newc').value || '').trim(); if (!n) { toast('Escribe el nombre del cajero.'); return; }
    const list = S.shop.cashiers || [];
    if (list.some(x => x.toLowerCase() === n.toLowerCase())) { toast('Ese cajero ya existe.'); return; }
    if (list.length >= 12) { toast('Máximo 12 cajeros.'); return; }
    if (await saveShop({cashiers:[...list, n]})) paint();
  },
  async delp(el){
    const id = el.dataset.id;
    if (S.delArm !== id) { S.delArm = id; paint(); setTimeout(() => { if (S.delArm === id) { S.delArm = null; render(); } }, 4000); return; }
    S.delArm = null;
    if (await write(() => S.db.doc('products/' + id).delete())) { S.db.doc('stock/' + id).delete().catch(() => {}); toast('Producto eliminado.'); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-add],[data-inc],[data-dec],[data-cat],[data-dt],[data-act],[data-sale],[data-pm],[data-recv],[data-rmc],[data-ov],[data-fl],[data-rk],[data-qty],[data-kp],[data-xt],[data-hres],[data-hdel]');
  if (!el) return;
  if (document.activeElement && document.activeElement.id === 'q') document.activeElement.blur();
  const d = el.dataset;
  if (d.qty) { openQty(d.qty); return; }
  if (d.xt) { const x = S.xp; if (!x) return; const i = x.sel.indexOf(d.xt); if (i >= 0) x.sel.splice(i, 1); else x.sel.push(d.xt); modalBox().innerHTML = extrasHTML(); return; }
  if (d.hres) { A.hres(d.hres); return; }
  if (d.hdel) { A.hdel(d.hdel); return; }
  if (d.kp !== undefined) { kpPress(d.kp); return; }
  if (d.ov !== undefined) { if (e.target === el && !S.pay && !S.co && !S.ci && !S.pc && !S.wm && !S.cnt) closeModal(); return; }
  if (d.add) return addToCart(d.add);
  if (d.fl) { flavorTap(d.fl); return; }
  if (d.rk) { S.rk = d.rk; paint(false); return; }
  if (d.inc) { const l = S.cart.find(x => (x.key || x.id) === d.inc); if (l) { l.qty++; saveCart(); paint(); } return; }
  if (d.dec) {
    const l = S.cart.find(x => (x.key || x.id) === d.dec); if (!l) return;
    const go = () => { l.qty--; if (l.qty <= 0) S.cart = S.cart.filter(x => x !== l); saveCart(); paint(); };
    if (l.qty <= 1 && MOTION()) {
      const row = [...document.querySelectorAll('.line')].find(r => r.dataset.k === d.dec);
      if (row) { if (row.classList.contains('out')) return; row.classList.add('out'); setTimeout(go, 140); return; }
    }
    go(); return;
  }
  if (d.cat) { S.cat = d.cat; paint(); return; }
  if (d.dt) { S.disc.t = d.dt; store.set('disc', S.disc); paint(); return; }
  if (d.sale) { const s = S.sales.find(x => x.id === d.sale); if (s) { S.voidAsk = false; openSale(s, false); } return; }
  if (d.pm) { S.pay.method = d.pm; S.pay.received = ''; modalBox().innerHTML = payHTML(); updateChg(); const f = $('#pcard') || $('#recv') || $('#pref'); if (f) f.focus(); return; }
  if (d.recv !== undefined) { S.pay.received = String(d.recv); const f = $('#recv'); if (f) f.value = d.recv; updateChg(); return; }
  if (d.rmc !== undefined) { const gone = (S.shop.cashiers || [])[+d.rmc]; if (gone && S.codes.users[gone]) { S.db.rpc('delete_cashier_code', {p_name:gone}).then(loadSecrets).catch(() => {}); }
    const list = (S.shop.cashiers || []).filter((_, i) => i !== +d.rmc); const patch = {cashiers:list};
    if (Array.isArray(S.shop.openers)) { const o = S.shop.openers.filter(n => list.includes(n)); patch.openers = o.length ? o : list; }
    saveShop(patch).then(ok => { if (ok) paint(); }); return; }
  if (d.act && A[d.act]) A[d.act](el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cd !== undefined && S.cnt) {
    const d = t.dataset.cd; S.cnt.q[d] = t.value;
    const sub = d === 'x' ? Math.max(0, parseFloat(t.value) || 0) : +d * Math.max(0, Math.floor(+t.value) || 0);
    const cs = $('#cs' + d), ct = $('#cnt-total'); if (cs) cs.textContent = sub ? money0(sub) : ''; if (ct) ct.textContent = money(cntTotal());
    return;
  }
  if (t.id === 'disc') { S.disc.v = Math.max(0, parseFloat(t.value) || 0); store.set('disc', S.disc); paintTotals(); }
  else if (t.id === 'q') { S.q = t.value; const pr = $('#prods'); if (pr) pr.innerHTML = prodsHTML(); }
  else if (t.id === 'recv' && S.pay) { S.pay.received = t.value; updateChg(); }
  else if (t.id === 'pref' && S.pay) { S.pay.ref = t.value; }
  else if (t.id === 'pcard' && S.pay) { S.pay.card = t.value; updateChg(); }
  else if (t.id === 'ptrans' && S.pay) { S.pay.trans = t.value; updateChg(); }
  else if (t.id === 'counted' || t.id === 'ccard' || t.id === 'ctrans') updateDiff();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'cashier') { S.cashier = t.value; store.set('cashier', S.cashier); return; }
  if (t.id === 'daysel') { S.day = t.value; S.reopenAsk = false; paint(false); return; }
  if (t.id === 'cfilter') { S.cf = t.value; paint(false); return; }
  if (t.id === 'rfrom' || t.id === 'rto') { S[t.id === 'rfrom' ? 'rFrom' : 'rTo'] = t.value; S.rk = 'otro'; paint(false); return; }
  if (t.id === 'logofile') { handleLogo(t.files && t.files[0]); t.value = ''; return; }
  if (t.dataset.ff) {
    const f = t.dataset.ff, id = t.dataset.id;
    let v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.round(parseFloat(t.value)) : t.value.trim();
    if (f === 'name' && !v) { toast('El nombre no puede quedar vacío.'); paint(); return; }
    if ((f === 'low' && !(v >= 0)) || (f === 'perTub' && !(v >= 1))) { toast('Escribe un número válido.'); paint(); return; }
    await write(() => S.db.doc('flavors/' + id).update({[f]:v}));
    return;
  }
  if (t.dataset.fondo !== undefined) { await saveDay(S.day, {fondo:Math.max(0, parseFloat(t.value) || 0)}); return; }
  if (t.dataset.opener !== undefined) {
    const names = [...document.querySelectorAll('[data-opener]')].filter(b => b.checked).map(b => b.dataset.opener);
    if (!names.length) { toast('Debe quedar al menos una persona autorizada.'); paint(); return; }
    if (await saveShop({openers:names})) toast('Personas autorizadas guardadas.');
    return;
  }
  if (t.dataset.sf) { await saveShop({[t.dataset.sf]:t.value.trim()}); return; }
  if (t.dataset.pf) {
    const f = t.dataset.pf, id = t.dataset.id;
    let v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? parseFloat(t.value) : t.value.trim();
    if (f === 'scoops' && v >= 0) v = Math.round(v);
    if (f === 'name' && !v) { toast('El nombre no puede quedar vacío.'); paint(); return; }
    if ((f === 'price' || f === 'low' || f === 'scoops') && !(v >= 0)) { toast('Escribe un número válido.'); paint(); return; }
    const ok = await write(() => S.db.doc('products/' + id).update({[f]:v}));
    if (ok && f === 'track' && v && !S.stock[id]) toast('Cuenta este producto en Inventario para empezar a controlarlo.');
    if (ok && f === 'track') paint();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden && !S.pay) closeModal(); });
document.addEventListener('keydown', e => {
  if (!S.qk || $('#modal').hidden) return;
  if (/^\d$/.test(e.key)) { kpPress(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { kpPress('back'); e.preventDefault(); }
  else if (e.key === 'Enter') { kpPress('ok'); e.preventDefault(); }
});
$('#view').addEventListener('animationend', e => { if (e.target === e.currentTarget) { const v = e.currentTarget; setTimeout(() => v.classList.remove('fadein'), 700); } });
window.addEventListener('hashchange', () => { S.sheet = false; S.reopenAsk = false; if (readTab() !== 'ajustes') S.unlocked = false; paint(false); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target && e.target.id;
  if (id === 'pin') A.pinenter(); else if (id === 'pin1' || id === 'pin2') A.pinsave(); else if (id === 'apin') A.authgo(); else if (id === 'lcode') A.loginok(); else if (id === 'q') A.qenter();
});

/* ───────── Conexión con los datos ───────── */
const allLoaded = () => Object.values(S.loaded).every(Boolean);
function listen(){
  const db = S.db;
  const timer = setTimeout(() => { if (!allLoaded()) { S.loadFailed = true; render(); } }, 10000);
  const mark = (k, snap) => { S.loaded[k] = true; S.online = !snap.metadata.fromCache; if (allLoaded()) { S.loadFailed = false; clearTimeout(timer); } render(); };
  const err = k => e => { S.err = (e && e.code) || k; render(); };
  db.collection('products').onSnapshot(snap => { S.products = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('products', snap); }, err('products'));
  db.collection('flavors').onSnapshot(snap => { S.flavors = snap.docs.map(d => ({id:d.id, ...d.data()})); S.fmap = {}; S.flavors.forEach(f => { S.fmap[f.id] = f; }); mark('flavors', snap); }, err('flavors'));
  db.collection('purchases').where('ts', '>=', S.histStart).orderBy('ts', 'desc').limit(500).onSnapshot(snap => { S.purchases = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('purchases', snap); }, err('purchases'));
  db.collection('waste').where('ts', '>=', S.histStart).orderBy('ts', 'desc').limit(500).onSnapshot(snap => { S.waste = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('waste', snap); }, err('waste'));
  db.collection('stock').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.stock = o; mark('stock', snap); }, err('stock'));
  db.collection('sales').where('ts', '>=', S.winStart).orderBy('ts', 'desc').limit(1000).onSnapshot(snap => { S.sales = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('sales', snap); }, err('sales'));
  db.collection('cashouts').where('ts', '>=', S.winStart).orderBy('ts', 'desc').limit(500).onSnapshot(snap => { S.cashouts = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('cashouts', snap); }, err('cashouts'));
  db.collection('cashins').where('ts', '>=', S.winStart).orderBy('ts', 'desc').limit(500).onSnapshot(snap => { S.cashins = snap.docs.map(d => ({id:d.id, ...d.data()})); mark('cashins', snap); }, err('cashins'));
  loadSecrets(); setInterval(loadSecrets, 60000); window.addEventListener('focus', loadSecrets);
  db.collection('voids').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.voids = o; mark('voids', snap); }, err('voids'));
  db.collection('days').orderBy('day', 'desc').limit(30).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.days = o; mark('days', snap); }, err('days'));
  db.doc('settings/shop').onSnapshot(snap => {
    S.shop = Object.assign({name:'', footer:'', cashiers:[]}, snap.exists ? snap.data() : {});
    if (!Array.isArray(S.shop.cashiers)) S.shop.cashiers = [];
    if (!Array.isArray(S.shop.openers)) delete S.shop.openers;
    if (!S.shop.cashiers.includes(S.cashier)) { S.cashier = S.shop.cashiers[0] || ''; store.set('cashier', S.cashier); }
    mark('shop', snap);
    if (S.isAdmin && snap.exists) migrateLogo();
  }, err('shop'));
}
/* ───────── Entrada con cuenta (Supabase) ───────── */
function showGate(msg, opts){
  const g = $('#gate'); opts = opts || {};
  g.hidden = false;
  if (opts.noaccess) {
    g.innerHTML = `<div class="box"><h1>Sin permisos</h1><p>${esc(msg)}</p><button class="btn pri" id="g-out">Cerrar sesión</button></div>`;
    $('#g-out').onclick = async () => { try { await S.sb.auth.signOut(); } catch {} location.reload(); };
    return;
  }
  g.innerHTML = `<form class="box" id="g-form" autocomplete="on"><img class="glogo" src="icons/logo.png" alt="" onerror="this.remove()"><h1>Un Momento Rolled</h1><p>Entra con la cuenta de este equipo.</p>
    <div class="fld"><label for="g-mail">Correo</label><input class="in" id="g-mail" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="g-pass">Contraseña</label><input class="in" id="g-pass" type="password" autocomplete="current-password" required></div>
    <div class="msg" id="g-msg" role="alert">${esc(msg || '')}</div>
    <button class="btn pri" id="g-go" type="submit">Entrar</button></form>`;
  $('#g-form').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#g-go'), m = $('#g-msg'); b.disabled = true; m.textContent = '';
    try {
      const {error} = await S.sb.auth.signInWithPassword({email:$('#g-mail').value.trim(), password:$('#g-pass').value});
      if (error) { m.textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar. Revisa el internet e intenta otra vez.'; b.disabled = false; return; }
      await enter();
    } catch { m.textContent = 'No se pudo entrar. Revisa el internet e intenta otra vez.'; b.disabled = false; }
  };
  setTimeout(() => { const e = $('#g-mail'); if (e) e.focus(); }, 50);
}
async function enter(){
  let w = null;
  try { w = await S.db.rpc('whoami'); } catch (e) { showGate('No se pudo conectar. Revisa el internet y recarga la página.', {noaccess:true}); return; }
  if (!w) { showGate('Esta cuenta no tiene acceso a la caja. Pide a quien administra que la habilite.', {noaccess:true}); return; }
  S.acct = w; S.isAdmin = w.role === 'admin';
  const g = $('#gate'); S.booting = false; listen(); paint();
  if (MOTION()) { g.classList.add('leave'); setTimeout(() => { g.hidden = true; g.classList.remove('leave'); g.innerHTML = ''; }, 300); } else { g.hidden = true; g.innerHTML = ''; }
}
async function boot(){
  paint();
  const cfg = window.CAJA_CONFIG, lib = window.supabase, CD = window.CajaDB;
  if (!cfg || !lib || !CD) { S.booting = false; showGate('Falta la configuración de la aplicación.', {noaccess:true}); return; }
  S.sb = lib.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  S.db = CD.create(S.sb);
  S.dl = {save: async ({filename, data}) => {
    const blob = new Blob([data], {type: /\.xlsx$/.test(filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }};
  S.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') setTimeout(() => location.reload(), 0); });
  let session = null;
  try { session = (await S.sb.auth.getSession()).data.session; } catch {}
  if (session) { await enter(); }
  else { S.booting = false; showGate(); }
}
/* La rueda del mouse no debe cambiar los montos: se suelta el campo antes de que la rueda lo toque. */
document.addEventListener('wheel', e => { const t = document.activeElement; if (t && t.tagName === 'INPUT' && t.type === 'number') t.blur(); }, {capture:true, passive:true});
document.addEventListener('pointerdown', bump, true);
document.addEventListener('keydown', bump, true);
try { const ro = new ResizeObserver(() => document.documentElement.style.setProperty('--hh', $('.hdr').offsetHeight + 'px')); ro.observe($('.hdr')); } catch {}
boot();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
